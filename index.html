<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratify - Tu app de aula</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Pantalla 1: Selección de Perfiles -->
    <div id="pantalla-perfiles" class="pantalla activa">
        <h1>¿Quién está escuchando?</h1>
        <div class="perfiles-container">
            <div class="perfil" onclick="mostrarLoginProfesor()">
                <img src="https://ui-avatars.com/api/?name=Profe&background=1DB954&color=fff&size=150" alt="Profesor">
                <p>Profesor</p>
            </div>
            <div class="perfil" onclick="mostrarLoginPadres()">
                <img src="https://ui-avatars.com/api/?name=Familia&background=181818&color=1DB954&size=150" alt="Padres">
                <p>Familia</p>
            </div>
        </div>
    </div>

    <!-- Pantalla 2A: Login Profesor -->
    <div id="pantalla-login" class="pantalla">
        <h2>Acceso Profesor</h2>
        <input type="password" id="password-profe" placeholder="Contraseña">
        <button onclick="entrarComoProfesor()">Entrar</button>
        <button class="btn-secundario" onclick="volverAPerfiles()">Cancelar</button>
    </div>

    <!-- Pantalla 2B: Login Familias -->
    <div id="pantalla-login-padres" class="pantalla">
        <h2>Acceso Familias</h2>
        <input type="password" id="password-padres" placeholder="Contraseña">
        <button onclick="entrarComoPadre()">Entrar</button>
        <button class="btn-secundario" onclick="volverAPerfiles()">Cancelar</button>
    </div>

    <!-- Pantalla 3: Aplicación Principal -->
    <div id="pantalla-app" class="pantalla">
        <header>
            <h2 id="titulo-seccion">Ratonera FM</h2>
            <button id="btn-subir" style="display: none;" onclick="abrirModalSubida()"><i class="fas fa-plus"></i> Subir Audio</button>
        </header>

        <main id="lista-reproduccion">
            <!-- Los audios se cargarán aquí desde Firebase -->
        </main>

        <!-- Mini Reproductor Inferior (Flotante) -->
        <div id="reproductor" style="display: none;" onclick="abrirReproductorCompleto()">
            <div class="info-pista">
                <img id="mini-cover" src="" alt="" class="portada-cancion" style="object-fit: cover;">
                <div class="textos-cancion">
                    <h4 id="mini-title">Selecciona un audio</h4>
                    <p id="mini-date">Ratify</p>
                </div>
            </div>
            <div class="controles-player" onclick="event.stopPropagation()">
                <i class="fas fa-play-circle play-btn mini-btn-play" onclick="togglePlay()"></i>
            </div>
        </div>

        <nav id="menu-inferior">
            <div class="tab activo" onclick="cambiarSeccion('Ratonera FM')">
                <i class="fas fa-podcast"></i><span>Ratonera FM</span>
            </div>
            <div class="tab" onclick="cambiarSeccion('DJ Rufi')">
                <i class="fas fa-compact-disc"></i><span>DJ Rufi</span>
            </div>
            <div class="tab" onclick="cambiarSeccion('Episodios Especiales')">
                <i class="fas fa-star"></i><span>Especiales</span>
            </div>
        </nav>
    </div>

    <!-- Pantalla 4: Reproductor Pantalla Completa -->
    <div id="reproductor-completo" class="pantalla">
        <button class="btn-cerrar-player" onclick="cerrarReproductorCompleto()"><i class="fas fa-chevron-down"></i></button>
        <img id="full-cover" src="" alt="Portada">
        <h2 id="full-title">Título</h2>
        <p id="full-date">Fecha</p>
        <div class="controles-grandes">
            <i class="fas fa-step-backward" onclick="playAnterior()"></i>
            <i class="fas fa-play-circle play-btn full-btn-play" onclick="togglePlay()"></i>
            <i class="fas fa-step-forward" onclick="playSiguiente()"></i>
        </div>
    </div>

    <!-- Modal de Subida de Archivos -->
    <div id="modal-subida" class="modal">
        <div class="modal-contenido">
            <h3>Subir Nuevo Episodio</h3>
            <input type="text" id="upload-titulo" placeholder="Título del episodio (ej. Noticias por ALEXANDER)">
            
            <label>Sección:</label>
            <select id="upload-seccion">
                <option value="Ratonera FM">Ratonera FM</option>
                <option value="DJ Rufi">DJ Rufi</option>
                <option value="Episodios Especiales">Episodios Especiales</option>
            </select>

            <label>Archivo de Audio (.mp3):</label>
            <input type="file" id="upload-audio" accept="audio/*">
            
            <label>Foto de Portada:</label>
            <input type="file" id="upload-portada" accept="image/*">
            
            <button onclick="ejecutarSubida()" id="btn-ejecutar-subida">Subir a Firebase</button>
            <button class="btn-secundario" onclick="cerrarModalSubida()">Cancelar</button>
        </div>
    </div>

    <!-- Elemento de audio real (invisible) -->
    <audio id="audio-elemento"></audio>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
      
        // RECUERDA PEGAR TUS CLAVES AQUÍ:
        const firebaseConfig = {
          apiKey: "TU_API_KEY",
          authDomain: "ratify-colegio.firebaseapp.com",
          projectId: "ratify-colegio",
          storageBucket: "ratify-colegio.appspot.com",
          messagingSenderId: "TU_SENDER_ID",
          appId: "TU_APP_ID"
        };
      
        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.storage = getStorage(app);
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.ref = ref;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;
      </script>

    <script src="app.js"></script>
</body>
</html>
