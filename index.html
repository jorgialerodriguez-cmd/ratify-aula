<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida Familias</title>
    <style>
        /* ESTILOS DE LA PANTALLA DEL RATÓN */
        #pantalla-raton {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fce4ec; /* Color de fondo amigable */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Para que esté por encima de todo */
            transition: opacity 0.5s ease; /* Efecto suave al desaparecer */
        }

        .raton-gigante {
            font-size: 150px; /* Tamaño muy grande para el ratón */
            margin-bottom: 20px;
        }

        .mensaje-bienvenida {
            font-size: 40px;
            font-family: 'Arial', sans-serif;
            color: #333;
            font-weight: bold;
        }

        /* ESTILOS DE LA PANTALLA DE PERFILES (Oculta al principio) */
        #pantalla-perfiles {
            display: none; /* Se oculta hasta que el ratón se vaya */
            text-align: center;
            padding: 50px;
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DEL RATÓN QUE SALUDA -->
    <div id="pantalla-raton">
        <!-- Puedes cambiar el emoji por una imagen usando <img src="ruta-de-tu-raton.png"> -->
        <div class="raton-gigante">🐭</div> 
        <div class="mensaje-bienvenida">¡Hola, familias!</div>
    </div>

    <!-- 2. PANTALLA DE SELECCIÓN DE PERFIL -->
    <div id="pantalla-perfiles">
        <h1>Selecciona un perfil</h1>
        <p>Aquí irían los botones para elegir perfil...</p>
    </div>

    <script>
        // LÓGICA PARA LOS 2 SEGUNDOS
        window.onload = function() {
            // Esperar 2000 milisegundos (2 segundos)
            setTimeout(function() {
                const pantallaRaton = document.getElementById('pantalla-raton');
                const pantallaPerfiles = document.getElementById('pantalla-perfiles');
                
                // Efecto de desvanecimiento
                pantallaRaton.style.opacity = '0';
                
                // Esperar a que termine el desvanecimiento para quitarlo del todo
                setTimeout(function() {
                    pantallaRaton.style.display = 'none';
                    // Mostrar la pantalla de perfiles
                    pantallaPerfiles.style.display = 'block';
                }, 500); // 500ms es lo que dura la transición CSS
                
            }, 2000);
        };
    </script>
</body>
</html>
